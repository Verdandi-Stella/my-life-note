<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Life Note</title><style> *{box-sizing:border-box}body{margin:0;background:#f4f5fa;color:#46536c;font:16px sans-serif}main{max-width:620px;margin:auto;padding:16px}h1{text-align:center;font:32px Georgia}section{background:white;border-radius:18px;padding:18px;margin:14px 0}input,select,button{font:inherit;padding:12px;border:1px solid #d8dce7;border-radius:10px;width:100%;margin:5px 0;color:inherit}button{background:#8498bb;color:white;border:0}label{display:block;margin-top:8px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.line{padding:10px 0;border-bottom:1px solid #eee;overflow-wrap:anywhere}.pie{width:190px;height:190px;border-radius:50%;margin:15px auto}small{color:#68758b}h2{font-size:18px}.hero{background:linear-gradient(135deg,#e1e8f5,#eee5f5)}strong{font-size:20px}.row #prev,.row #next{flex:0 0 42px}.row #period{text-align:center;font-size:14px}.line button{width:auto;padding:7px 14px;margin:5px 6px 0 0;font-size:13px}.line button:last-child{background:#a16d7b}main{padding-bottom:90px}nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:white;border-top:1px solid #ddd;padding:8px;gap:5px;z-index:5}nav button{font-size:13px;padding:10px 3px}section[hidden]{display:none}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tiles div{background:#fff9;padding:12px;border-radius:12px}.tiles strong{display:block;margin-top:6px}.urgent{color:#a23e50;font-weight:bold}small{display:block} </style><main><h1>My Life Note</h1><small style="text-align:center">Version 3.0</small><section class="hero"><div class="row"><button id="prev">‹</button><span id="period"></span><button id="next">›</button></div><p>期間内の収支（残高とは別）</p><strong id="net"></strong><p id="summary"></p><p>現金・銀行残高（全期間）</p><strong id="cash"></strong><div class="tiles"><div>電子マネー<strong id="electronic"></strong></div><div>未払い総額<strong id="debtTotal"></strong></div></div><p id="available"></p><p id="daily"></p><p id="warning"></p><small>初期残高と支払い予定を登録してから利用してください。</small></section><section id="budget"><h2>予算・固定費</h2><label>期間の生活費予算（円）<input id="budgetAmount" type="number" min="0" step="1"></label><label>次の給料日までの未登録固定費（円）<input id="fixedAmount" type="number" min="0" step="1"></label><button id="saveBudget">予算を保存</button><p id="budgetStatus"></p><small>固定費は後払い予定や支出に登録済みの分を除き、支払ったら残額を更新してください。</small></section><section><h2>記録する</h2><form id="form"><label>日付<input id="date" type="date" required></label><label>種類<select id="type"><option value="expense">支出</option><option value="income">収入</option><option value="transfer">チャージ・資金移動</option><option value="credit">後払いチャージ</option><option value="opening">初期残高</option><option value="debt">既存の未払い残高</option><option value="settle">後払い精算</option></select></label><label id="methodLabel">決済方法</label><select id="method"></select><div id="targetWrap"><label>移動先<select id="target"></select></label></div><div id="catWrap"><label>カテゴリー<select id="category"></select></label></div><label>金額<input id="amount" type="number" min="1" step="1" required></label><div id="dueWrap"><label>支払期限（任意）<input id="due" type="date"></label></div><label>メモ<input id="memo"></label><button id="submit">記録する</button><button type="button" id="cancel" hidden>編集を中止</button></form></section><section><h2>決済残高・未払い</h2><div id="balances"></div><h2>支払い予定</h2><div id="bills"></div></section><section><h2>支出割合</h2><select id="group"><option value="category">カテゴリー別</option><option value="method">決済方法別</option></select><div class="pie" id="pie"></div><div id="legend"></div></section><section><h2>期間内の記録</h2><div id="history"></div></section><section><h2>バックアップ</h2><button id="backup">JSONを保存</button><label>復元（現在の記録を置換）<input id="restore" type="file" accept=".json,application/json"></label><small>端末内保存です。ブラウザデータを消す前にバックアップしてください。</small></section></main><nav><button data-tab="home">ホーム</button><button data-tab="entry">記録</button><button data-tab="balance">残高</button><button data-tab="analysis">分析</button></nav><script>
const $=x=>document.getElementById(x),key='myLifeNoteV1',assets=['現金','銀行口座','au PAY','メルペイ残高','バンドルカード残高'],debts=['auかんたん決済','メルカード','メルペイ後払い','atone','バンドルカード後払い','GMO後払い','その他後払い'],all=[...assets,...debts,'未設定'],cats=['家賃','食費','水道・光熱費','通信費','医療費','ジム','日用品','交通費','美容・衣服','趣味','交際費','材料費','返済','その他'],inc=['給与','賞与','副収入','ハンドメイド売上','その他'],names={expense:'支出',income:'収入',transfer:'資金移動',credit:'後払いチャージ',opening:'初期残高',debt:'既存債務',settle:'精算'};let records=[],editing=null,blocked=false;try{records=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(records))throw Error()}catch(e){blocked=true;alert('保存データを読めません。上書きを停止します。')}
const dt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,now=new Date(),cycle=d=>new Date(d.getFullYear(),d.getMonth()-(d.getDate()<25?1:0),25),yen=n=>'¥'+n.toLocaleString('ja-JP');let month=cycle(now);function options(id,a){$(id).replaceChildren(...a.map(x=>new Option(x,x)))}function fields(){let t=$('type').value;options('method',t==='credit'||t==='debt'?debts:t==='expense'?all:assets);options('target',t==='settle'?debts:assets);options('category',t==='income'?inc:cats);$('targetWrap').hidden=!['transfer','credit','settle'].includes(t);$('catWrap').hidden=!['expense','income'].includes(t);$('dueWrap').hidden=!['expense','credit','debt'].includes(t);$('methodLabel').textContent=t==='settle'||t==='transfer'?'支払元':t==='credit'||t==='debt'?'後払いサービス':'決済方法'}function save(a){if(blocked)return false;try{localStorage.setItem(key,JSON.stringify(a));records=a;return true}catch(e){alert('保存できません');return false}}function reset(){editing=null;$('form').reset();$('date').value=dt(now);fields();$('submit').textContent='記録する';$('cancel').hidden=true}function line(parent,s){let d=document.createElement('div');d.className='line';d.textContent=s;$(parent).append(d);return d}function button(p,s,f){let b=document.createElement('button');b.type='button';b.textContent=s;b.onclick=f;p.append(b)}
$('type').onchange=fields;$('cancel').onclick=reset;$('form').onsubmit=e=>{e.preventDefault();let t=$('type').value,m=$('method').value,target=$('target').value,n=Number($('amount').value);if(!Number.isSafeInteger(n)||n<=0)return;if(t==='transfer'&&m===target)return alert('異なる移動先を選択してください');let r={id:editing||crypto.randomUUID(),date:$('date').value,type:t,method:m,target,category:$('category').value,amount:n,due:$('due').value,memo:$('memo').value};if(save([...records.filter(x=>x.id!==editing),r])){month=cycle(new Date(r.date+'T12:00:00'));reset();render()}};
function render(){let end=dt(new Date(month.getFullYear(),month.getMonth()+1,24)),start=dt(month),list=records.filter(r=>r.date>=start&&r.date<=end),sum=t=>list.filter(r=>r.type===t).reduce((a,r)=>a+r.amount,0);$('period').textContent=start+' ～ '+end;$('net').textContent=yen(sum('income')-sum('expense'));$('summary').textContent='収入 '+yen(sum('income'))+' ／ 支出 '+yen(sum('expense'));let bal=Object.fromEntries(all.map(x=>[x,0])),lots=[];let add=(m,n)=>{if(m in bal)bal[m]+=n};for(let r of [...records].filter(r=>r.date<=dt(now)).sort((a,b)=>a.date.localeCompare(b.date))){let m=r.method||'未設定',n=r.amount,t=r.type;if(t==='income'||t==='opening')add(m,n);if(t==='expense')add(m,debts.includes(m)?n:-n);if(t==='transfer'){add(m,-n);add(r.target,n)}if(t==='credit'){add(m,n);add(r.target,n)}if(t==='debt')add(m,n);if(t==='debt'||t==='credit'||(t==='expense'&&debts.includes(m)))lots.push({m,n,due:r.due||''});if(t==='settle'){add(m,-n);add(r.target,-n);let left=n;for(let l of lots.filter(l=>l.m===r.target).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'))){let p=Math.min(left,l.n);l.n-=p;left-=p}}}let cash=bal['現金']+bal['銀行口座'],nextPay=dt(new Date(cycle(now).getFullYear(),cycle(now).getMonth()+1,25)),due=lots.filter(l=>l.due&&l.due<nextPay).reduce((a,l)=>a+l.n,0);$('cash').textContent=yen(cash);$('electronic').textContent=yen(assets.slice(2).reduce((a,m)=>a+bal[m],0));$('debtTotal').textContent=yen(lots.reduce((a,l)=>a+l.n,0));let b=budgets[start]||{},current=start===dt(cycle(now)),unknown=lots.filter(l=>!l.due&&l.n>0).reduce((a,l)=>a+l.n,0),fixed=Number(b.fixed||0),free=cash-due-unknown-fixed,days=Math.max(1,Math.round((new Date(nextPay+'T12:00:00')-new Date(dt(now)+'T12:00:00'))/86400000));$('budgetAmount').value=b.limit??'';$('fixedAmount').value=b.fixed??'';$('budgetStatus').textContent=b.limit==null?'予算未設定':'支出予算残額：'+yen(b.limit-sum('expense'));$('available').textContent=current?'次の給料日前の資金過不足：'+yen(free):'資金過不足は現在の期間で表示します';$('daily').textContent=current?'1日あたりの現金目安：'+yen(Math.max(0,Math.floor(Math.min(free,b.limit==null?Infinity:b.limit-sum('expense'))/days))):'';$('warning').textContent=(unknown?'期限未設定 '+yen(unknown)+' は安全のため控除しています。 ':'')+(bal['未設定']?'決済方法未設定の記録があります。 ':'')+'電子マネー・未登録の請求は現金目安に含みません。';$('balances').replaceChildren();all.forEach(m=>line('balances',m+'：'+yen(bal[m])));$('bills').replaceChildren();lots.filter(l=>l.n>0).forEach(l=>{let x=line('bills',l.m+' ／ '+(l.due||'期限未設定')+' ／ '+yen(l.n));if(!l.due||l.due<=dt(new Date(now.getFullYear(),now.getMonth(),now.getDate()+7)))x.classList.add('urgent')});let groups={};list.filter(r=>r.type==='expense').forEach(r=>{let k=r[$('group').value]||'未設定';groups[k]=(groups[k]||0)+r.amount});let pos=0,parts=[],colors=['#91a6c7','#b5a0cf','#94bcb4','#e4b7c5','#e5cc98','#7d9baa','#c7b8a6'];$('legend').replaceChildren();Object.entries(groups).sort((a,b)=>b[1]-a[1]).forEach(([k,n],i)=>{let p=n/sum('expense')*100,c=colors[i%colors.length];parts.push(`${c} ${pos}% ${pos+p}%`);pos+=p;let l=line('legend','● '+k+' '+yen(n)+' / '+p.toFixed(1)+'%');l.style.borderLeft='6px solid '+c});$('pie').style.background=parts.length?'conic-gradient('+parts.join(',')+')':'#eee';$('history').replaceChildren();list.sort((a,b)=>b.date.localeCompare(a.date)).forEach(r=>{let l=line('history',`${r.date} ${names[r.type]||r.type} ${['expense','income'].includes(r.type)?r.category||'':''} ${r.method||'未設定'} ${yen(r.amount)} ${r.memo||''}`);button(l,'編集',()=>{editing=r.id;$('type').value=r.type;fields();$('method').value=r.method||'未設定';if(!$('method').value)$('method').value=assets[0];$('target').value=r.target||assets[0];$('category').value=r.category||cats[0];$('date').value=r.date;$('amount').value=r.amount;$('due').value=r.due||'';$('memo').value=r.memo||'';$('submit').textContent='変更を保存';$('cancel').hidden=false;$('form').scrollIntoView()});button(l,'削除',()=>{if(confirm('削除しますか？')&&save(records.filter(x=>x.id!==r.id)))render()})})}
$('prev').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,25);render()};$('next').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,25);render()};$('group').onchange=render;$('backup').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify({records,budgets},null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='my-life-note-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('restore').onchange=async()=>{try{let raw=JSON.parse(await $('restore').files[0].text()),a=Array.isArray(raw)?raw:raw.records;if(!Array.isArray(a)||!a.every(r=>r&&typeof r.id==='string'&&typeof r.date==='string'&&r.type in names&&Number.isSafeInteger(r.amount)&&r.amount>0))throw Error();if(confirm('現在の記録をバックアップの内容に置き換えますか？')&&save(a)){if(!Array.isArray(raw)&&raw.budgets&&typeof raw.budgets==='object'){budgets=raw.budgets;localStorage.setItem('myLifeNoteBudgetV3',JSON.stringify(budgets))}reset();render()}}catch(e){alert('バックアップを読み込めません')}};let budgets={};try{budgets=JSON.parse(localStorage.getItem('myLifeNoteBudgetV3')||'{}')||{}}catch(e){}$('saveBudget').onclick=()=>{let limit=$('budgetAmount').value,fixed=$('fixedAmount').value;if([limit,fixed].some(v=>v!==''&&(!Number.isSafeInteger(Number(v))||Number(v)<0)))return alert('0以上の整数を入力してください');budgets[dt(month)]={limit:limit===''?null:Number(limit),fixed:Number(fixed||0)};try{localStorage.setItem('myLifeNoteBudgetV3',JSON.stringify(budgets));render()}catch(e){alert('予算を保存できません')}};let sections=[...document.querySelectorAll('main>section')];function tab(t){let ids={home:[0,1],entry:[2,5],balance:[3],analysis:[4,6]}[t];sections.forEach((s,i)=>s.hidden=!ids.includes(i));window.scrollTo(0,0)}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));reset();render();tab('home');</script></html>

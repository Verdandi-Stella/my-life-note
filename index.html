
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#8498bb">
<title>My Life Note</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#f4f5fa;
 color:#46536c;
 font-family:Arial,sans-serif;
}
main{max-width:600px;margin:auto;padding:16px}
h1{text-align:center;font-family:Georgia,serif;
 font-weight:normal;letter-spacing:2px}
.subtitle{text-align:center;color:#8993a7}
section{
 background:white;
 border-radius:18px;
 padding:20px;
 margin:16px 0;
 box-shadow:0 3px 15px #46536c0b;
}
.balance{
 background:linear-gradient(135deg,#e1e8f5,#eee5f5);
 text-align:center;
}
.total{font-size:32px;font-weight:bold;margin:12px}
.summary{display:flex;justify-content:space-around}
label{display:block;font-size:14px;margin-top:12px}
input,select,button{
 width:100%;padding:12px;margin-top:7px;
 font-size:16px;border:1px solid #d8dce7;
 border-radius:10px;background:white;color:#46536c;
}
button{
 background:#8498bb;color:white;
 border:0;font-weight:bold;cursor:pointer;
}
h2{font-size:18px}
.period{display:flex;align-items:center;gap:8px}
.period button{width:45px;margin:0}
.period span{flex:1;text-align:center}
.pie{
 width:210px;height:210px;
 border-radius:50%;margin:20px auto;
 background:#e9eaf0;
}
.line{
 display:flex;align-items:center;
 justify-content:space-between;
 gap:8px;padding:12px 0;
 border-bottom:1px solid #eef0f5;
 font-size:14px;
}
.dot{
 display:inline-block;width:12px;height:12px;
 border-radius:50%;margin-right:8px;
}
.delete{
 width:auto;background:#bd8794;
 padding:7px 10px;font-size:12px;margin:0;
}
small{color:#8993a7}
footer{text-align:center;font-size:12px;color:#8993a7;padding:20px}
</style>
</head>
<body>
<main>
<h1>My Life Note</h1>
<p class="subtitle">未来の私へ、小さな積み重ね。</p>

<section>
<div class="period">
<button onclick="move(-1)">‹</button>
<span id="period"></span>
<button onclick="move(1)">›</button>
</div>
</section>

<section class="balance">
<div>今月の収支残額</div>
<div class="total" id="balance">¥0</div>
<div class="summary">
<div>収入<br><strong id="income">¥0</strong></div>
<div>支出<br><strong id="expense">¥0</strong></div>
</div>
</section>

<section>
<h2>収入・支出を記録</h2>
<form id="form">
<label>日付</label>
<input type="date" id="date" required>
<label>種類</label>
<select id="type" onchange="categories()">
<option value="expense">支出</option>
<option value="income">収入</option>
</select>
<label>カテゴリー</label>
<select id="category"></select>
<label>金額（円）</label>
<input type="number" id="amount" min="1" step="1" required placeholder="0">
<label>メモ</label>
<input id="memo" placeholder="購入したものなど">
<button type="submit">記録する</button>
</form>
</section>

<section>
<h2>支出割合</h2>
<div class="pie" id="pie"></div>
<div id="legend"></div>
</section>

<section>
<h2>今月の記録</h2>
<div id="history"></div>
</section>

<footer>My Life Note — Version 1.0</footer>
</main>

<script>
const $=id=>document.getElementById(id);
const key="myLifeNoteV1";
let records=[];
try{
 records=JSON.parse(localStorage.getItem(key)||"[]");
}catch(e){
 alert("保存データを読み込めませんでした");
}
const now=new Date();
let month=new Date(now.getFullYear(),now.getMonth()-(now.getDate()<25?1:0),25);

const expenseCats=[
 "家賃","食費","水道・光熱費","通信費",
 "医療費","ジム","日用品","交通費",
 "美容・衣服","趣味","交際費","材料費",
 "返済","その他"
];
const incomeCats=[
 "給与","賞与","副収入","ハンドメイド売上","その他"
];
const colors=[
 "#91a6c7","#b5a0cf","#94bcb4","#e4b7c5",
 "#e5cc98","#7d9baa","#c7b8a6","#a4b5df",
 "#c5a6b0","#a4c6a0","#d6b0de","#b6b9c8",
 "#d2a58d","#8a92aa"
];

function dateText(d){
 return d.getFullYear()+"-"+
 String(d.getMonth()+1).padStart(2,"0")+"-"+
 String(d.getDate()).padStart(2,"0");
}
function yen(n){return "¥"+n.toLocaleString("ja-JP")}
function categories(){
 $("category").replaceChildren();
 const list=$("type").value==="income"?incomeCats:expenseCats;
 list.forEach(c=>$("category").add(new Option(c,c)));
}
function move(n){
 month=new Date(month.getFullYear(),month.getMonth()+n,25);
 render();
}
function save(next){
 try{
  localStorage.setItem(key,JSON.stringify(next));
  records=next;
  return true;
 }catch(e){
  alert("保存できませんでした。端末の設定を確認してください。");
  return false;
 }
}
$("date").value=dateText(now);
categories();

$("form").addEventListener("submit",e=>{
 e.preventDefault();
 const amount=Number($("amount").value);
 if(!Number.isSafeInteger(amount)||amount<=0)return;
 const item={
  id:crypto.randomUUID(),
  date:$("date").value,
  type:$("type").value,
  category:$("category").value,
  amount:amount,
  memo:$("memo").value
 };
 if(!save([...records,item]))return;
 const d=new Date(item.date+"T12:00:00");
 month=new Date(d.getFullYear(),d.getMonth()-(d.getDate()<25?1:0),25);
 $("amount").value="";
 $("memo").value="";
 render();
});

function removeItem(id){
 if(!confirm("この記録を削除しますか？"))return;
 if(save(records.filter(r=>r.id!==id)))render();
}

function render(){
 const end=new Date(month.getFullYear(),month.getMonth()+1,24);
 $("period").textContent=dateText(month)+" ～ "+dateText(end);
 const list=records.filter(r=>r.date>=dateText(month)&&r.date<=dateText(end));
 const income=list.filter(r=>r.type==="income").reduce((a,r)=>a+r.amount,0);
 const expense=list.filter(r=>r.type==="expense").reduce((a,r)=>a+r.amount,0);
 $("income").textContent=yen(income);
 $("expense").textContent=yen(expense);
 $("balance").textContent=yen(income-expense);

 const groups={};
 list.filter(r=>r.type==="expense").forEach(r=>{
  groups[r.category]=(groups[r.category]||0)+r.amount;
 });
 $("legend").replaceChildren();
 let start=0;
 const segments=[];
 Object.entries(groups).sort((a,b)=>b[1]-a[1]).forEach(([name,value],i)=>{
  const percent=value/expense*100;
  const color=colors[i%colors.length];
  segments.push(color+" "+start+"% "+(start+percent)+"%");
  start+=percent;
  const row=document.createElement("div");
  row.className="line";
  const title=document.createElement("span");
  const dot=document.createElement("span");
  dot.className="dot";
  dot.style.background=color;
  title.append(dot,document.createTextNode(name));
  const text=document.createElement("strong");
  text.textContent=yen(value)+" / "+percent.toFixed(1)+"%";
  row.append(title,text);
  $("legend").append(row);
 });
 $("pie").style.background=segments.length?
 "conic-gradient("+segments.join(",")+")":"#e9eaf0";
 if(!expense)$("legend").textContent="まだ支出の記録がありません";

 $("history").replaceChildren();
 list.sort((a,b)=>b.date.localeCompare(a.date)).forEach(r=>{
  const row=document.createElement("div");
  row.className="line";
  const detail=document.createElement("div");
  const date=document.createElement("small");
  date.textContent=r.date;
  const title=document.createElement("div");
  title.textContent=r.category+" "+r.memo;
  detail.append(date,title);
  const value=document.createElement("strong");
  value.textContent=(r.type==="income"?"+":"−")+yen(r.amount);
  const btn=document.createElement("button");
  btn.className="delete";
  btn.textContent="削除";
  btn.onclick=()=>removeItem(r.id);
  row.append(detail,value,btn);
  $("history").append(row);
 });
 if(!list.length)$("history").textContent="まだ記録がありません";
}
render();
</script>
</body>
</html>
